<div class="container form-shell">
  <form #f="ngForm" autocomplete="off" (ngSubmit)="save()">
    <div class="card">
      <div class="form-header">
        <p class="eyebrow">CRM</p>
        <h1>{{ isEdit ? 'Editar cliente' : 'Novo cliente' }}</h1>
      </div>

      <div class="p-grid p-fluid">
        <div class="p-col-12 p-md-6">
          <label for="nomeEmpresa">Empresa</label>
          <input id="nomeEmpresa" pInputText name="nomeEmpresa" type="text" [(ngModel)]="client.nomeEmpresa" [ngModelOptions]="{ updateOn: 'blur' }" required #nomeEmpresa="ngModel">
        </div>

        <div class="p-col-12 p-md-6">
          <label for="cnpj">CNPJ</label>
          <input id="cnpj" pInputText name="cnpj" type="text" [(ngModel)]="client.cnpj" required #cnpj="ngModel">
        </div>

      </div>

      <div class="actions">
        <button pButton type="submit" label="Salvar" [disabled]="f.invalid"></button>
        <a pButton type="button" label="Cancelar" severity="secondary" routerLink="/clients"></a>
      </div>
    </div>
  </form>
</div>
