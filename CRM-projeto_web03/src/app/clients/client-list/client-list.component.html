<div class="container page-shell">
  <div class="page-header">
    <div>
      <p class="eyebrow">CRM</p>
      <h1>Clientes</h1>
    </div>
    <a pButton label="Novo cliente" icon="pi pi-plus" routerLink="/clients/new"></a>
  </div>

  <div class="card surface">
    <div class="p-fluid" style="margin-bottom: 1rem; max-width: 320px;">
      <label for="filtro">Buscar cliente</label>
      <input id="filtro" pInputText type="text" [(ngModel)]="filtro" placeholder="Empresa ou CNPJ">
    </div>

    <p-table [value]="filteredClients" [tableStyle]="{ 'min-width': '100%' }">
      <ng-template pTemplate="header">
        <tr>
          <th>Empresa</th>
          <th>CNPJ</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-client>
        <tr>
          <td>{{ client.nomeEmpresa || client.empresa || client.nome }}</td>
          <td>{{ client.cnpj }}</td>
          <td>
            <span class="status-badge" [ngClass]="client.status === 'Ativo' ? 'active' : 'potential'">
              {{ client.status }}
            </span>
          </td>
          <td>
            <a pButton type="button" icon="pi pi-pencil" severity="secondary" [routerLink]="['/clients', client.id, 'edit']" title="Editar"></a>
            <button pButton type="button" icon="pi pi-trash" severity="danger" class="ml-2" (click)="delete(client.id)" title="Excluir"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="4">Nenhum cliente cadastrado.</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
