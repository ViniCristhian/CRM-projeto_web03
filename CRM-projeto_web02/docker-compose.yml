version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: crm-web02-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-V142454}
      MYSQL_DATABASE: crm_pra_tu_db
      MYSQL_USER: crm_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-V142454}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
